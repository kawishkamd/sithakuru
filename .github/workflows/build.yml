name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          else
            echo "::warning::KEYSTORE_BASE64 is not configured; the release APK will be debug-signed."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleSithakuruRelease assembleSithakuruDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sithakuru-release-apk
          path: app/build/outputs/apk/sithakuru/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sithakuru-debug-apk
          path: app/build/outputs/apk/sithakuru/debug/*.apk

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: sithakuru-release-apk
          path: artifacts

      - name: Refuse to publish a debug-signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured. A release key is required to publish."
            exit 1
          fi

      - name: Verify APK signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs artifacts/*.apk
          else
            echo "::warning::apksigner not found; skipping signature verification."
          fi

      - name: Name the APK after the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv artifacts/*.apk "artifacts/sithakuru-${version}.apk"
          (cd artifacts && sha256sum "sithakuru-${version}.apk" > "sithakuru-${version}.apk.sha256")
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${VERSION}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "Sithakuru ${VERSION}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "Sithakuru ${VERSION}" --generate-notes
          fi
